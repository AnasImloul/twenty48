[workspace]
members = ["crates/twenty48", "crates/twenty48-ai", "crates/twenty48-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
twenty48 = { path = "crates/twenty48", version = "0.1.0" }
twenty48-ai = { path = "crates/twenty48-ai", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

# The GUI is unusable in a debug build, because a search at the default depth
# takes seconds per move rather than milliseconds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
