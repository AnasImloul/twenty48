name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The exhaustive table tests are slow in debug, and the table code is
      # optimisation-sensitive enough to be worth testing as it ships.
      - run: cargo test --release

      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo bench --no-run

      # Table indices are written so that LLVM can fold the bounds check away,
      # which is what lets the engine be `forbid(unsafe_code)` without paying
      # for the checks. Fail the build if one comes back after a refactor.
      #
      # The clean is what makes this honest: a cached build emits no assembly,
      # the glob then matches nothing, and the grep would pass by finding no
      # file rather than no bounds check. The `ls` is the same guard again.
      - name: No bounds checks in the engine
        run: |
          cargo clean -p twenty48
          cargo rustc --release -p twenty48 --lib -- --emit=asm
          ls target/release/deps/twenty48-*.s
          ! grep -q panic_bounds_check target/release/deps/twenty48-*.s
